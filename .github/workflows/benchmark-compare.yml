name: Benchmark revision comparison

on:
  push:
    branches: [bench/pr2592-cross-os]
  workflow_dispatch:
    inputs:
      repository:
        description: Repository containing both revisions
        default: pymc-devs/pytensor
      base_ref:
        description: Base revision or ref
        default: b273b3b342c41c8fcc26e8504fcf65aaac4e9910
      head_ref:
        description: Candidate revision or ref (for example refs/pull/2647/head)
        required: true
        default: 8f89089e495b9e2b1aaa5793757a28320257a168
      case_file:
        description: Case file from this workflow's checkout
        default: scripts/benchmarks/scalar_optimize.py
      runners:
        description: Runner labels as a JSON array (select one to retry a platform)
        default: '["ubuntu-24.04", "ubuntu-24.04-arm", "windows-2025", "macos-15"]'

permissions:
  contents: read

env:
  BENCH_REPOSITORY: ${{ inputs.repository || 'pymc-devs/pytensor' }}
  BENCH_BASE: ${{ inputs.base_ref || 'b273b3b342c41c8fcc26e8504fcf65aaac4e9910' }}
  BENCH_HEAD: ${{ inputs.head_ref || '8f89089e495b9e2b1aaa5793757a28320257a168' }}
  BENCH_CASE: ${{ inputs.case_file || 'scripts/benchmarks/scalar_optimize.py' }}

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      base: ${{ steps.refs.outputs.base }}
      head: ${{ steps.refs.outputs.head }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - id: refs
        shell: bash
        run: >-
          python scripts/benchmarks/compare.py --resolve-only
          --repository "$BENCH_REPOSITORY" --base "$BENCH_BASE" --head "$BENCH_HEAD"

  compare:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.runners || '["ubuntu-24.04", "ubuntu-24.04-arm", "windows-2025", "macos-15"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install pinned dependencies
        run: >-
          python -m pip install --only-binary=:all:
          -r scripts/benchmarks/requirements.txt
      - name: Compare revisions
        shell: bash
        env:
          BASE_SHA: ${{ needs.resolve.outputs.base }}
          HEAD_SHA: ${{ needs.resolve.outputs.head }}
        run: >-
          python scripts/benchmarks/compare.py
          --repository "$BENCH_REPOSITORY" --base "$BASE_SHA" --head "$HEAD_SHA"
          --case-file "$BENCH_CASE" --output benchmark-results
          --batches 15 --calls 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: benchmark-${{ matrix.os }}
          path: benchmark-results/
